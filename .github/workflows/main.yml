name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Find the project folder
        id: find
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts NOT FOUND. Files in the repository:"
            find . -not -path "./.git/*" -type f | head -50
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TwoFingerVolume-apk
          path: "**/app-debug.apk"
